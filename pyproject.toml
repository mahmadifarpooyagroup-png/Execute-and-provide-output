[project]
name = "atrin-core"
version = "0.3.0"
description = "Atrin AI Control Plane - Vendor-Neutral Core"
requires-python = ">=3.10"
dependencies = [
    "pydantic>=2.0.0,<3.0.0",
    "fastapi>=0.100.0,<1.0.0",
    "uvicorn>=0.23.0,<1.0.0",
    "httpx>=0.24.0,<1.0.0",
    "cryptography>=42.0.0,<47.0.0",
    "playwright>=1.40.0,<2.0.0",
    "psutil>=5.9.0,<8.0.0"
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0,<10.0.0",
    "pytest-asyncio>=0.21.0,<2.0.0",
    "ruff>=0.12.0,<1.0.0",
    "mypy>=1.15.0,<2.0.0",
    "bandit>=1.8.0,<2.0.0"
]

[build-system]
requires = ["setuptools>=68.0,<81.0]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["atrin_core*"]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
# Keep correctness-oriented linting in the release gate. UP is a style-only
# modernization family and would turn harmless Python 3.10-compatible syntax
# into a blocker without changing runtime behavior.
select = ["E", "F", "B", "I"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.12"
warn_unused_ignores = true
warn_redundant_casts = true
no_implicit_optional = true
check_untyped_defs = true
ignore_missing_imports = true

[tool.bandit]
exclude_dirs = ["tests", ".venv", "venv"]
skips = ["B101"]
