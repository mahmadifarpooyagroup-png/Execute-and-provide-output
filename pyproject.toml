[project]
name = "atrin-core"
version = "0.1.0"
description = "Atrin AI Control Plane - Vendor-Neutral Core"
requires-python = ">=3.10"
dependencies = [
    "pydantic>=2.0.0",
    "fastapi>=0.100.0",
    "uvicorn>=0.23.0",
    "httpx>=0.24.0",
    "cryptography>=42.0.0",
    "playwright>=1.40.0",
    "psutil>=5.9.0"
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-asyncio>=0.21.0"
]

[tool.setuptools.packages.find]
where = ["."]
include = ["atrin_core*"]
