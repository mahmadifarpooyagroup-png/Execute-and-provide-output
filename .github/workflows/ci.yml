name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: atrin-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  python:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.11', '3.12', '3.13', '3.14']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install package and test dependencies
        run: python -m pip install -e '.[dev]'
      - name: Cache Playwright browsers
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ matrix.python-version }}-${{ hashFiles('pyproject.toml') }}
      - name: Install Playwright browser dependencies
        run: python -m playwright install --with-deps chromium
      - name: Compile Python sources
        run: python -m compileall -q atrin_core
      - name: Ruff lint
        run: ruff check atrin_core tests
      - name: Mypy type check
        run: mypy atrin_core
      - name: Bandit security scan
        run: bandit -q -r atrin_core
      - name: Run Python tests
        env:
          PYTHONPATH: .
        run: pytest -q --ignore=tests/test_ui_browser_e2e.py

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Build
        run: npm run build

  ui-e2e:
    name: Browser E2E
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.13'
          cache: pip
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install Python test dependencies
        run: python -m pip install -e '.[dev]'
      - name: Install frontend dependencies
        run: npm ci
        working-directory: frontend
      - name: Cache Playwright browsers
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-ui-${{ runner.os }}-${{ hashFiles('pyproject.toml') }}
      - name: Install Playwright browser
        run: python -m playwright install --with-deps chromium
      - name: Run browser E2E
        env:
          PYTHONPATH: .
        run: pytest -q tests/test_ui_browser_e2e.py

  tauri:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    defaults:
      run:
        working-directory: frontend/src-tauri
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install Tauri Linux system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            build-essential \
            curl \
            wget \
            file \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev
      - uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1
        with:
          toolchain: stable
          components: rustfmt
          cache: false
      - name: Synchronize Cargo.lock
        if: github.event_name == 'push'
        shell: bash
        run: |
          cargo generate-lockfile
          if ! git diff --quiet -- frontend/src-tauri/Cargo.lock; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add frontend/src-tauri/Cargo.lock
            git commit -m "chore(tauri): synchronize Cargo.lock [skip ci]"
            git push
          fi
      - name: Format Rust sources
        if: github.event_name == 'push'
        shell: bash
        run: |
          cargo fmt --all
          if ! git diff --quiet -- frontend/src-tauri; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add frontend/src-tauri
            git commit -m "style(tauri): apply rustfmt [skip ci]"
            git push
          fi
      - name: Check Rust formatting
        run: cargo fmt --all -- --check
      - name: Check Tauri Rust project
        run: cargo check --locked

  tauri-windows:
    runs-on: windows-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1
        with:
          toolchain: stable
          cache: false
      - name: Install frontend dependencies
        run: npm ci
      - name: Build Windows NSIS package
        run: npm run tauri -- build --ci
      - name: Upload Windows installer
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: atrin-windows-nsis
          path: frontend/src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error
